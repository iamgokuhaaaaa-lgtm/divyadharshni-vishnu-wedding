name: Replace countdown with elegant live timer

on:
  push:
    paths:
      - '.github/workflows/replace-countdown.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refine countdown
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_markup = '''<div class="countdown-section text-panel" style="margin:0 16px;">
            <div id="elegantCountdown" class="elegant-countdown" aria-label="Countdown to the wedding">
              <div class="countdown-kicker">OUR WEDDING DAY</div>
              <div class="countdown-date">30 <span>AUGUST</span> 2026</div>
              <div class="countdown-heart" aria-hidden="true">♥</div>
              <div class="countdown-row">
                <div class="countdown-unit"><span id="countdownDays">--</span><small>DAYS</small></div>
                <div class="countdown-separator">:</div>
                <div class="countdown-unit"><span id="countdownHours">--</span><small>HOURS</small></div>
                <div class="countdown-separator">:</div>
                <div class="countdown-unit"><span id="countdownMinutes">--</span><small>MINUTES</small></div>
              </div>
              <div class="countdown-foot">UNTIL OUR BIG DAY</div>
            </div>
          </div>

          <div class="details">'''
          s, n = re.subn(r'<div class="countdown-section text-panel" style="margin:0 16px;">.*?\n\s*<div class="details">', new_markup, s, count=1, flags=re.S)
          if n == 0:
              raise SystemExit('Could not find countdown section; aborting')

          script = '''<script>
          // Elegant live countdown — 30 Aug 2026, 08:00 IST.
          (function(){
            const target = new Date('2026-08-30T08:00:00+05:30').getTime();
            const daysEl = document.getElementById('countdownDays');
            const hoursEl = document.getElementById('countdownHours');
            const minsEl = document.getElementById('countdownMinutes');
            const mainEl = document.getElementById('elegantCountdown');
            function update(){
              const diff = Math.max(0, target - Date.now());
              const totalMinutes = Math.floor(diff / 60000);
              const days = Math.floor(totalMinutes / 1440);
              const hours = Math.floor((totalMinutes % 1440) / 60);
              const minutes = totalMinutes % 60;
              daysEl.textContent = String(days).padStart(2,'0');
              hoursEl.textContent = String(hours).padStart(2,'0');
              minsEl.textContent = String(minutes).padStart(2,'0');
              mainEl.classList.remove('countdown-pulse');
              void mainEl.offsetWidth;
              mainEl.classList.add('countdown-pulse');
            }
            update();
            setInterval(update, 1000);
          })();
          </script>'''
          s, n2 = re.subn(r'<script>\s*// Elegant live countdown.*?</script>', script, s, count=1, flags=re.S)
          if n2 == 0:
              raise SystemExit('Could not find countdown script; aborting')

          css = '''
          /* Premium single-line wedding countdown */
          .elegant-countdown{text-align:center;margin:0 auto;padding:24px 10px 26px;color:var(--plum);position:relative;overflow:hidden}
          .countdown-kicker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.34em;color:var(--gold);margin-bottom:8px}
          .countdown-date{font-family:'Playfair Display',serif;font-size:clamp(22px,6vw,30px);line-height:1;letter-spacing:.08em;color:var(--plum-deep)}
          .countdown-date span{font-family:'Cinzel',serif;font-size:.62em;letter-spacing:.20em;vertical-align:middle;color:var(--lavender)}
          .countdown-heart{color:var(--gold);font-size:15px;line-height:1;margin:9px 0 8px;animation:heartPop 1.8s ease-in-out infinite;text-shadow:0 0 12px rgba(190,150,80,.22)}
          .countdown-row{display:flex;align-items:flex-end;justify-content:center;gap:clamp(7px,2.3vw,16px);white-space:nowrap}
          .countdown-unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(72px,22vw,110px)}
          .countdown-unit span{font-family:'Playfair Display',serif;font-size:clamp(38px,10.5vw,58px);line-height:.9;font-weight:500;letter-spacing:.01em;color:var(--plum-deep)}
          .countdown-unit small{margin-top:7px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.24em;color:var(--lavender)}
          .countdown-separator{font-family:'Playfair Display',serif;font-size:34px;line-height:1;color:var(--gold);padding-bottom:19px;opacity:.75}
          .countdown-foot{margin-top:15px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.30em;color:var(--gold)}
          .countdown-pulse{animation:countdownPulse .65s ease-out}
          @keyframes countdownPulse{0%{opacity:.72;transform:scale(.985)}45%{opacity:1;transform:scale(1.012)}100%{opacity:1;transform:scale(1)}}
          @keyframes heartPop{0%,100%{transform:scale(1);opacity:.72}12%{transform:scale(1.22);opacity:1}24%{transform:scale(1);opacity:.82}}
          @media (max-width:420px){.countdown-row{gap:4px}.countdown-unit{min-width:68px}.countdown-unit span{font-size:35px}.countdown-separator{font-size:28px;padding-bottom:18px}.countdown-unit small{font-size:7px;letter-spacing:.18em}}
          @media (prefers-reduced-motion:reduce){.countdown-pulse,.countdown-heart{animation:none}}
          '''
          # Remove any prior countdown CSS block, then insert the new one.
          s, n3 = re.subn(r'/\* Premium single-line wedding countdown \*/.*?@media \(prefers-reduced-motion:reduce\)\{\.countdown-pulse,.countdown-heart\{animation:none\}\}', '', s, count=1, flags=re.S)
          if n3 == 0:
              s, n3 = re.subn(r'/\* Elegant live countdown \*/.*?@media \(prefers-reduced-motion:reduce\)\{\.countdown-pulse\{animation:none;\}\}', '', s, count=1, flags=re.S)
          s, n4 = re.subn(r'</style>', css + '\n</style>', s, count=1)
          if n4 == 0:
              raise SystemExit('Could not find </style>; aborting')

          p.write_text(s, encoding='utf-8')
          print('Countdown refined')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine countdown with elegant single-line layout"
          git push
