name: Wedding invitation polish and preview sync

on:
  push:
    paths:
      - '.github/workflows/replace-countdown.yml'
      - 'preview/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply invitation polish and preview setup
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re
          import shutil

          repo = Path('.')
          p = repo / 'index.html'
          s = p.read_text(encoding='utf-8')

          # 1) Keep exactly one easy-to-replace preview image in preview/.
          preview = repo / 'preview'
          preview.mkdir(exist_ok=True)
          image_exts = {'.png', '.jpg', '.jpeg', '.webp'}
          images = sorted([x for x in preview.iterdir() if x.is_file() and x.suffix.lower() in image_exts])
          if not images:
              source = repo / 'ChatGPT Image Aug 21, 2026, 05_27_19 PM.png'
              if source.exists():
                  shutil.copy2(source, preview / 'whatsapp-preview.png')
                  images = [preview / 'whatsapp-preview.png']

          if images:
              chosen = images[0]
              public_path = 'https://iamgokuhaaaaa-lgtm.github.io/divyadharshni-vishnu-wedding/' + quote(str(chosen).replace('\\','/'))
              s = re.sub(r'(<meta property="og:image" content=")[^"]*(")', r'\g<1>' + public_path + r'\2', s, count=1)
              s = re.sub(r'(<meta name="twitter:image" content=")[^"]*(")', r'\g<1>' + public_path + r'\2', s, count=1)

          # 2) Replace the countdown markup with the clean single-line version.
          new_markup = '''<div class="countdown-section text-panel" style="margin:0 16px;">
            <div id="elegantCountdown" class="elegant-countdown" aria-label="Countdown to the wedding">
              <div class="countdown-kicker">OUR WEDDING DAY</div>
              <div class="countdown-date">30 <span>AUGUST</span> 2026</div>
              <div class="countdown-heart" aria-hidden="true">♥</div>
              <div class="countdown-row">
                <div class="countdown-unit"><span id="countdownDays">--</span><small>DAYS</small></div>
                <div class="countdown-separator">:</div>
                <div class="countdown-unit"><span id="countdownHours">--</span><small>HOURS</small></div>
                <div class="countdown-separator">:</div>
                <div class="countdown-unit"><span id="countdownMinutes">--</span><small>MINUTES</small></div>
              </div>
              <div class="countdown-foot">UNTIL OUR BIG DAY</div>
            </div>
          </div>

          <div class="details">'''
          s, n = re.subn(r'<div class="countdown-section text-panel" style="margin:0 16px;">.*?\n\s*<div class="details">', new_markup, s, count=1, flags=re.S)
          if n == 0:
              raise SystemExit('Could not find the existing countdown section; aborting safely')

          # 3) Add the approved Vinayakar artwork at the top. It uses the same image
          #    chosen from the original preview, cropped to its upper artwork area.
          ganesh_block = '''<div class="vinayaka-top" aria-hidden="true">
            <img src="https://iamgokuhaaaaa-lgtm.github.io/divyadharshni-vishnu-wedding/ChatGPT%20Image%20Aug%2021%2C%202026%2C%2005_27_19%20PM.png" alt="">
          </div>'''
          if 'class="vinayaka-top"' not in s:
              s, n = re.subn(r'(<div class="page"[^>]*>)', r'\1\n' + ganesh_block, s, count=1)
              if n == 0:
                  raise SystemExit('Could not find .page container; aborting safely')

          # 4) Inject CSS once, replacing our own previous polish block if present.
          css = '''
          /* Wedding invitation polish: Vinayakar + single-line live countdown */
          .vinayaka-top{height:132px;width:100%;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;position:relative;z-index:2;margin:0 0 2px}
          .vinayaka-top img{width:100%;height:132px;object-fit:cover;object-position:50% 0%;display:block;filter:saturate(.94) contrast(.98)}
          .elegant-countdown{text-align:center;margin:0 auto;padding:22px 4px 24px;color:var(--plum);position:relative;overflow:hidden}
          .countdown-kicker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.34em;color:var(--gold);margin-bottom:8px}
          .countdown-date{font-family:'Playfair Display',serif;font-size:clamp(22px,6vw,30px);line-height:1;letter-spacing:.08em;color:var(--plum-deep)}
          .countdown-date span{font-family:'Cinzel',serif;font-size:.62em;letter-spacing:.20em;vertical-align:middle;color:var(--lavender)}
          .countdown-heart{color:var(--gold);font-size:24px;line-height:1;margin:10px 0 8px;animation:heartPop 1.8s ease-in-out infinite;text-shadow:0 0 13px rgba(190,150,80,.25)}
          .countdown-row{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,1.7vw,13px);white-space:nowrap}
          .countdown-unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(70px,21vw,106px)}
          .countdown-unit span{font-family:'Playfair Display',serif;font-size:clamp(38px,10.3vw,58px);line-height:.9;font-weight:500;letter-spacing:.01em;color:var(--plum-deep)}
          .countdown-unit small{margin-top:7px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.22em;color:var(--lavender)}
          .countdown-separator{font-family:'Playfair Display',serif;font-size:34px;line-height:1;color:var(--gold);padding-bottom:19px;opacity:.72}
          .countdown-foot{margin-top:15px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.30em;color:var(--gold)}
          .countdown-number-pulse{animation:numberPulse .55s ease-out}
          @keyframes numberPulse{0%{transform:scale(.96);opacity:.68}45%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
          @keyframes heartPop{0%,100%{transform:scale(1);opacity:.72}12%{transform:scale(1.28);opacity:1}24%{transform:scale(1);opacity:.82}}
          @media (max-width:420px){.vinayaka-top,.vinayaka-top img{height:116px}.countdown-row{gap:2px}.countdown-unit{min-width:65px}.countdown-unit span{font-size:34px}.countdown-separator{font-size:27px;padding-bottom:17px}.countdown-unit small{font-size:7px;letter-spacing:.17em}}
          @media (prefers-reduced-motion:reduce){.countdown-number-pulse,.countdown-heart{animation:none}}
          '''
          marker_start = '/* Wedding invitation polish: Vinayakar + single-line live countdown */'
          if marker_start in s:
              s = re.sub(r'/\* Wedding invitation polish: Vinayakar \+ single-line live countdown \*/.*?@media \(prefers-reduced-motion:reduce\)\{\.countdown-number-pulse,.countdown-heart\{animation:none\}\}', css.strip(), s, count=1, flags=re.S)
          else:
              s, n = re.subn(r'</style>', css + '\n</style>', s, count=1)
              if n == 0:
                  raise SystemExit('Could not find </style>; aborting safely')

          # 5) Add a runtime layer for the live timer and remove only the duplicate
          #    standalone date boxes, leaving the main date above the countdown alone.
          js = '''<script id="wedding-polish-script">
          (function(){
            const target = new Date('2026-08-30T08:00:00+05:30').getTime();
            const d = document.getElementById('countdownDays');
            const h = document.getElementById('countdownHours');
            const m = document.getElementById('countdownMinutes');
            const root = document.getElementById('elegantCountdown');
            function pulse(el){el.classList.remove('countdown-number-pulse');void el.offsetWidth;el.classList.add('countdown-number-pulse');}
            function update(){
              const diff=Math.max(0,target-Date.now());
              const total=Math.floor(diff/60000);
              const days=Math.floor(total/1440), hours=Math.floor((total%1440)/60), mins=total%60;
              const vals=[String(days).padStart(2,'0'),String(hours).padStart(2,'0'),String(mins).padStart(2,'0')];
              const els=[d,h,m];
              els.forEach((el,i)=>{if(el.textContent!==vals[i]){el.textContent=vals[i];pulse(el);}});
            }
            function hideDuplicateDates(){
              document.querySelectorAll('body *').forEach(function(el){
                if(el.closest('#elegantCountdown') || el.closest('.vinayaka-top')) return;
                const t=(el.textContent||'').replace(/\\s+/g,' ').trim();
                if(/^(30 AUGUST 2026|30 August 2026|AUGUST 30, 2026|August 30, 2026)$/.test(t)){
                  const p=el.parentElement;
                  if(p && p.children.length<=3 && (p.textContent||'').replace(/\\s+/g,' ').trim()===t) p.remove();
                  else el.remove();
                }
              });
            }
            hideDuplicateDates();
            update();
            setInterval(update,1000);
          })();
          </script>'''
          if 'id="wedding-polish-script"' in s:
              s = re.sub(r'<script id="wedding-polish-script">.*?</script>', js, s, count=1, flags=re.S)
          else:
              s, n = re.subn(r'</body>', js + '\n</body>', s, count=1)
              if n == 0:
                  raise SystemExit('Could not find </body>; aborting safely')

          p.write_text(s, encoding='utf-8')

          # 6) Keep project memory alongside the site.
          ctx = repo / 'PROJECT_CONTEXT.md'
          if ctx.exists():
              text = ctx.read_text(encoding='utf-8')
          else:
              text = '# Divyadharshni & Vishnu Wedding Invitation — Project Context\n'
          marker = '### 2026-08-21 — Countdown / Vinayakar / preview automation'
          if marker not in text:
              text += f'''\n\n{marker}\n- Countdown presentation changed again: no flip clock; days, hours, and minutes are large and on one line.\n- The wedding date is intentionally static; only the countdown numbers animate.\n- Heart is larger and gently pulses. Countdown numbers pulse only when their displayed value changes.\n- Added a top Vinayakar artwork crop using the approved preview artwork.\n- Removed duplicate standalone date presentation at runtime so the golden duplicate date does not remain visible.\n- Added `preview/` as the dedicated social-preview folder.\n- The automation uses the first image file in `preview/` as the Open Graph/Twitter preview. Keep only one preview image in that folder.\n- If `preview/` is empty on first setup, the existing approved preview image is copied into it as `whatsapp-preview.png`.\n- Future workflow runs automatically update `og:image` and `twitter:image` when the preview image is replaced.\n'''
              ctx.write_text(text, encoding='utf-8')

          print('Invitation polish applied')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html preview PROJECT_CONTEXT.md
          git diff --cached --quiet && exit 0
          git commit -m "Polish countdown, add Vinayakar, automate WhatsApp preview"
          git push
