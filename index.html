<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Divyadharshni &amp; Vishnu — Wedding Invitation</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Divyadharshni & Vishnu — Wedding Invitation">
  <meta property="og:description" content="You're invited to celebrate the wedding of Divyadharshni & Vishnu.">
  <meta property="og:url" content="https://iamgokuhaaaaa-lgtm.github.io/divyadharshni-vishnu-wedding/">
  <meta property="og:image" content="https://iamgokuhaaaaa-lgtm.github.io/divyadharshni-vishnu-wedding/preview/DSC04255.JPG">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Divyadharshni & Vishnu wedding invitation">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://iamgokuhaaaaa-lgtm.github.io/divyadharshni-vishnu-wedding/preview/DSC04255.JPG">
  <script>
    // Top-level image variables — change the filename only (easy edits)
    const IMG_DIR = {
      previewDir: 'preview/',
      backgroundDir: 'background/',
      photosDir: 'photos/'
    };
    const IMG_FILE = {
      preview: 'DSC04255.JPG',
      background: 'background.jpg',
      couple: 'faraway.jpeg'
    };
    const IMAGE_PATHS = {
      preview: IMG_DIR.previewDir + IMG_FILE.preview,
      background: IMG_DIR.backgroundDir + IMG_FILE.background,
      couple: IMG_DIR.photosDir + IMG_FILE.couple
    };

    // Apply background immediately so CSS sees it as soon as possible
    document.documentElement.style.setProperty('--bg-photo', `url("${IMAGE_PATHS.background}")`);

    function applyImagePaths(){
      const og = document.querySelector('meta[property="og:image"]');
      if(og) og.content = IMAGE_PATHS.preview;
      const tw = document.querySelector('meta[name="twitter:image"]');
      if(tw) tw.content = IMAGE_PATHS.preview;
      const coupleImg = document.querySelector('.photo-frame img');
      if(coupleImg) coupleImg.src = IMAGE_PATHS.couple;
    }

    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyImagePaths);
    else applyImagePaths();
  </script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@500;600&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF7F1;
    --ivory-2:#F5EEE3;
    --plum:#4A3560;
    --plum-deep:#372748;
    --lavender:#8C6BAE;
    --lavender-light:#C9B6E0;
    --lilac-pale:#EDE3F5;
    --gold:#B4914A;
    --gold-light:#D9C48F;
    --rose:#C97B84;
    --line: rgba(74,53,96,0.18);

    /* Background photo — change the filename to try another image in background/ */
    --bg-photo: url("background/background.jpg");
    --bg-photo-position: center 15%;
    --bg-photo-saturate: 0.95;

    /* Cream wash over the background photo.
       --bg-veil: 0 = photo fully visible, 1 = current wash, above 1 = heavier wash. */
    --bg-veil: 1;
    --bg-veil-top: 0.42;
    --bg-veil-mid: 0.22;
    --bg-veil-deep: 0.18;
    --bg-veil-bottom: 0.5;

    /* Frosted invitation cards sitting on the photo */
    --panel-opacity: 0.62;
    --panel-blur: 1.2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ivory);
    color: var(--plum);
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  /* ---------- Translucent background portrait ---------- */
  .bg-photo{
    position:fixed;
    top:0; left:50%;
    transform: translateX(-50%);
    width:100%;
    max-width:480px;
    height:100vh;
    z-index:0;
    background-image: var(--bg-photo);
    background-size: cover;
    background-position: var(--bg-photo-position);
    filter: saturate(var(--bg-photo-saturate));
    pointer-events:none;
  }

  .content{ position:relative; z-index:1; padding-bottom:56px; }

  .text-panel{
    background: rgba(251,247,241, var(--panel-opacity));
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    border-radius: 28px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 10px 24px rgba(74,53,96,0.08);
  }
  .text-panel::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(125deg,
      rgba(255,255,255,0.55) 0%,
      rgba(255,255,255,0.18) 24%,
      rgba(255,255,255,0.02) 42%,
      rgba(255,255,255,0.14) 100%);
    pointer-events:none;
    opacity:0.9;
  }
  .bg-photo::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(180deg,
      rgba(251,247,241, var(--bg-veil-top)) 0%,
      rgba(237,227,245, var(--bg-veil-mid)) 40%,
      rgba(74,53,96, var(--bg-veil-deep)) 65%,
      rgba(251,247,241, var(--bg-veil-bottom)) 100%);
    opacity: var(--bg-veil);
    pointer-events:none;
  }

  /* ---------- Corner florals ---------- */
  .corner{ position:absolute; width:120px; height:120px; opacity:0.85; z-index:2; pointer-events:none; }
  .corner svg{ width:100%; height:100%; }
  .corner-tl{ top:0; left:0; }
  .corner-tr{ top:0; right:0; transform:scaleX(-1); }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding: 54px 32px 26px;
    text-align:center;
  }
  .eyebrow{
    font-family:'Cinzel Decorative', serif;
    font-weight:400;
    font-size:10.5px;
    letter-spacing:3.5px;
    color: var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .eyebrow-sub{
    font-size:13px;
    letter-spacing:1.5px;
    color: var(--lavender);
    text-transform:uppercase;
    margin-bottom:20px;
  }
  .ganesh{
    width:56px;
    height:56px;
    margin: 0 auto 16px;
  }
  .title-word{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:500;
    font-size:22px;
    letter-spacing:1px;
    color: var(--plum-deep);
    margin-bottom:16px;
  }
  .names{
    font-family:'Alex Brush', cursive;
    font-size:clamp(44px, 12vw, 58px);
    line-height:0.95;
    color: var(--plum-deep);
    margin: 4px 0;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    white-space:nowrap;
    letter-spacing:0.02em;
  }
  .names-small{
    font-size:clamp(38px, 10.5vw, 52px);
  }
  .with-word{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(30px, 7vw, 42px);
    color: var(--lavender);
    margin: 4px 0;
    letter-spacing:0.02em;
    line-height:1;
  }
  .parents{
    font-size:14px;
    letter-spacing:0.3px;
    color: var(--plum);
    opacity:0.8;
    margin-top:10px;
    line-height:1.7;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin: 24px auto;
    width:70%;
  }
  .divider .ln{ height:1px; flex:1; background:var(--line); }
  .divider .mk{ color:var(--gold); font-size:13px; }

  /* ---------- Photo ---------- */
  .photo-wrap{
    position:relative;
    margin: 0 auto 8px;
    width: calc(100% - 64px);
    max-width:340px;
  }
  .photo-frame{
    position:relative;
    border-radius: 4px;
    overflow:hidden;
    border: 1px solid var(--line);
    padding:10px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(2px);
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
    border-radius: 2px;
  }
  .photo-frame::before{
    content:"";
    position:absolute;
    inset:4px;
    border: 1px solid var(--gold-light);
    border-radius:2px;
    pointer-events:none;
  }

  /* ---------- Countdown / Flip clock ---------- */
  .countdown-section{
    padding: 18px 20px 4px;
    text-align:center;
  }
  .countdown-label{
    font-family:'Cinzel', serif;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:18px;
  }
  .flip-row{
    display:flex;
    justify-content:center;
    gap: 8px;
  }
  .flip-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .flip-digits{
    display:flex;
    gap:3px;
  }
  .flip-card{
    position:relative;
    width: 34px;
    height: 46px;
    font-family:'Cinzel', serif;
    font-weight:600;
  }
  .flip-card .half{
    position:absolute;
    left:0; right:0;
    height:50%;
    overflow:hidden;
    background: var(--plum-deep);
    color: var(--gold-light);
    font-size:22px;
    display:flex;
    justify-content:center;
  }
  .flip-card .top{
    top:0;
    border-radius:4px 4px 0 0;
    align-items:flex-end;
  }
  .flip-card .top span{ display:block; line-height:46px; }
  .flip-card .bottom{
    bottom:0;
    border-radius:0 0 4px 4px;
    align-items:flex-start;
  }
  .flip-card .bottom span{ display:block; line-height:46px; transform: translateY(-23px); }
  .flip-card::after{
    content:"";
    position:absolute;
    left:0; right:0; top:calc(50% - 0.5px);
    height:1px;
    background: rgba(0,0,0,0.35);
    z-index:7;
  }
  .flip-card .flap{
    position:absolute;
    left:0; right:0; top:0;
    height:50%;
    overflow:hidden;
    background: var(--plum-deep);
    color: var(--gold-light);
    font-size:22px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    border-radius:4px 4px 0 0;
    transform-origin: bottom;
    transform: scaleY(1);
    transition: transform 0.2s ease-in;
    z-index:6;
  }
  .flip-card .flap span{ display:block; line-height:46px; }
  .flip-card .flap.squish{ transform: scaleY(0.05); transition: transform 0.2s ease-out; }
  .flip-unit .lbl{
    font-family:'Cinzel', serif;
    font-size:10.5px;
    letter-spacing:1.8px;
    text-transform:uppercase;
    color: var(--lavender);
  }
  .flip-colon{
    align-self:center;
    color: var(--gold);
    font-size:20px;
    font-weight:700;
    margin: 0 1px 18px;
  }

  /* ---------- Date & Venue ---------- */
  .details{
    margin: 34px 24px 0;
    padding: 0;
    position:relative;
  }
  .date-badge{
    text-align:center;
    background: linear-gradient(160deg, var(--rose) 0%, var(--gold) 50%, var(--gold-light) 100%);
    border-radius: 130px 130px 10px 10px / 90px 90px 10px 10px;
    padding: 40px 20px 22px;
    box-shadow: 0 14px 28px rgba(180,145,74,0.32);
    position:relative;
  }
  .date-badge::before{
    content:"";
    position:absolute;
    inset:4px;
    border:1px solid rgba(255,255,255,0.55);
    border-radius: 126px 126px 8px 8px / 86px 86px 8px 8px;
    pointer-events:none;
  }
  .date-emblem{
    position:absolute;
    top:12px; left:50%;
    transform:translateX(-50%);
    width:26px; height:26px;
    opacity:0.9;
  }
  .date-day{
    font-family:'Cinzel', serif;
    font-size:12.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color: rgba(255,255,255,0.92);
  }
  .date-main{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:27px;
    letter-spacing:0.5px;
    color: #fff;
    margin: 4px 0;
    text-shadow: 0 2px 6px rgba(74,53,96,0.25);
  }
  .date-time{
    font-size:16px;
    color: rgba(255,255,255,0.95);
    font-style:italic;
    font-weight:500;
  }

  .venue-block{
    text-align:center;
    padding: 22px 20px 0;
  }
  .venue-address{
    font-size:14.5px;
    color: var(--plum);
    opacity:0.85;
    line-height:1.5;
    margin-top:8px;
  }
  .map-line{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    text-decoration:none;
    padding: 12px 18px;
    border-radius: 999px;
    background: rgba(251,247,241, var(--panel-opacity));
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 10px 22px rgba(74,53,96,0.12);
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .map-line:hover{
    transform: translateY(-1px);
    background: rgba(251,247,241, calc(var(--panel-opacity) + 0.08));
    box-shadow: 0 12px 24px rgba(74,53,96,0.18);
  }
  .map-line:active{ opacity:0.75; }
  @keyframes pinBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }
  .map-line .pin{
    width:24px; height:24px;
    flex-shrink:0;
    filter: drop-shadow(0 4px 6px rgba(66,133,244,0.4));
    animation: pinBounce 2.2s ease-in-out infinite;
  }
  .map-line .pin svg{ width:100%; height:100%; }
  .map-line .venue-info{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    text-align:left;
  }
  .map-line .venue-name{
    font-family:'Cinzel', serif;
    font-size:15px;
    letter-spacing:0.6px;
    color: var(--plum-deep);
    text-transform:uppercase;
    border-bottom: 1.5px solid var(--gold);
    padding-bottom:2px;
    text-shadow: 0 1px 3px rgba(255,255,255,0.6);
  }
  .map-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:6px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(140,107,174,0.10);
    border: 1px solid rgba(74,53,96,0.18);
    font-family:'Cinzel', serif;
    font-size:9px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color: var(--plum-deep);
  }
  @media (prefers-reduced-motion: reduce){
    .map-line .pin{ animation:none; }
  }

  /* ---------- Footer ---------- */
  .footer{
    margin-top:36px;
    text-align:center;
    padding: 0 32px;
  }
  .footer .fam{
    font-size:14px;
    color: var(--plum);
    opacity:0.75;
    line-height:1.6;
  }
  .footer .sign{
    margin-top:14px;
    font-family:'Alex Brush', cursive;
    font-size:24px;
    color: var(--lavender);
  }

  @media (prefers-reduced-motion: reduce){
    .flip-card .flap{ transition:none; }
  }




/* Premium single-line wedding countdown */
.elegant-countdown{text-align:center;margin:0 auto;padding:24px 10px 26px;color:var(--plum);position:relative;overflow:hidden}
.countdown-kicker{font-family:'Cinzel',serif;font-size:9px;letter-spacing:.34em;color:var(--gold);margin-bottom:8px}
.countdown-date{font-family:'Playfair Display',serif;font-size:clamp(22px,6vw,30px);line-height:1;letter-spacing:.08em;color:var(--plum-deep);text-shadow:0 0 18px rgba(180,145,74,0.28)}
.countdown-date span{font-family:'Cinzel',serif;font-size:.62em;letter-spacing:.20em;vertical-align:middle;color:var(--lavender)}
.countdown-heart{color:var(--gold);font-size:15px;line-height:1;margin:9px 0 8px;animation:heartPop 1.8s ease-in-out infinite;text-shadow:0 0 12px rgba(190,150,80,.22)}
.countdown-row{display:flex;align-items:flex-end;justify-content:center;gap:clamp(7px,2.3vw,16px);white-space:nowrap}
.countdown-unit{display:flex;flex-direction:column;align-items:center;min-width:clamp(72px,22vw,110px)}
.countdown-unit span{font-family:'Playfair Display',serif;font-size:clamp(38px,10.5vw,58px);line-height:.9;font-weight:500;letter-spacing:.01em;color:var(--plum-deep)}
.countdown-unit small{margin-top:7px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.24em;color:var(--lavender)}
.countdown-separator{font-family:'Playfair Display',serif;font-size:34px;line-height:1;color:var(--gold);padding-bottom:19px;opacity:.75}
.countdown-foot{margin-top:15px;font-family:'Cinzel',serif;font-size:8px;letter-spacing:.30em;color:var(--gold)}
.countdown-pulse{animation:countdownPulse .65s ease-out}
@keyframes countdownPulse{0%{opacity:.72;transform:scale(.985)}45%{opacity:1;transform:scale(1.012)}100%{opacity:1;transform:scale(1)}}
@keyframes heartPop{0%,100%{transform:scale(1);opacity:.72}12%{transform:scale(1.22);opacity:1}24%{transform:scale(1);opacity:.82}}
@media (max-width:420px){.countdown-row{gap:4px}.countdown-unit{min-width:68px}.countdown-unit span{font-size:35px}.countdown-separator{font-size:28px;padding-bottom:18px}.countdown-unit small{font-size:7px;letter-spacing:.18em}}
@media (prefers-reduced-motion:reduce){.countdown-pulse,.countdown-heart{animation:none}}

</style>
</head>
<body>
<div class="page">
  <div class="bg-photo"></div>

  <div class="content">

  <div class="corner corner-tl">
    <svg viewBox="0 0 120 120" fill="none">
      <path d="M2 2 C 30 6, 50 20, 55 55" stroke="#8C6BAE" stroke-width="1.2" opacity="0.5"/>
      <circle cx="10" cy="10" r="4" fill="#C9B6E0" opacity="0.6"/>
      <circle cx="22" cy="6" r="6" fill="#B4914A" opacity="0.35"/>
      <path d="M8 30 C 2 20, 10 8, 22 6 C 34 4, 34 18, 22 20 C 12 22, 12 34, 8 30 Z" fill="#8C6BAE" opacity="0.25"/>
      <path d="M38 4 C 30 4, 26 14, 34 18 C 42 22, 46 10, 38 4 Z" fill="#D9C48F" opacity="0.5"/>
    </svg>
  </div>
  <div class="corner corner-tr">
    <svg viewBox="0 0 120 120" fill="none">
      <path d="M2 2 C 30 6, 50 20, 55 55" stroke="#8C6BAE" stroke-width="1.2" opacity="0.5"/>
      <circle cx="10" cy="10" r="4" fill="#C9B6E0" opacity="0.6"/>
      <circle cx="22" cy="6" r="6" fill="#B4914A" opacity="0.35"/>
      <path d="M8 30 C 2 20, 10 8, 22 6 C 34 4, 34 18, 22 20 C 12 22, 12 34, 8 30 Z" fill="#8C6BAE" opacity="0.25"/>
      <path d="M38 4 C 30 4, 26 14, 34 18 C 42 22, 46 10, 38 4 Z" fill="#D9C48F" opacity="0.5"/>
    </svg>

    const days = Math.floor(totalMinutes / 1440);
    const hours = Math.floor((totalMinutes % 1440) / 60);
    const minutes = totalMinutes % 60;
    if(daysEl) daysEl.textContent = String(days).padStart(2,'0');
    if(hoursEl) hoursEl.textContent = String(hours).padStart(2,'0');
    if(minsEl) minsEl.textContent = String(minutes).padStart(2,'0');
    valueEls.filter(Boolean).forEach(el => {
      el.classList.remove('countdown-pulse');
      void el.offsetWidth;
      el.classList.add('countdown-pulse');
    });
  }
  update();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
